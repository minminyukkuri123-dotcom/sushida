<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寿司打 自動プレイボット</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .panel {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        
        .panel h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #feca57;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #a0a0a0;
        }
        
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1rem;
        }
        
        input[type="text"]:focus, textarea:focus {
            outline: 2px solid #feca57;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #ff6b6b, #feca57);
            color: #1a1a2e;
            font-weight: bold;
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
        
        .btn-danger {
            background: #e74c3c;
            color: #fff;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        #log {
            height: 300px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        
        .log-info { color: #3498db; }
        .log-success { color: #2ecc71; }
        .log-warning { color: #f39c12; }
        .log-error { color: #e74c3c; }
        
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        
        .status-running { background: #2ecc71; }
        .status-stopped { background: #e74c3c; }
        
        .instructions {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #feca57;
        }
        
        .instructions ol {
            margin-left: 20px;
        }
        
        .instructions li {
            margin-bottom: 8px;
        }
        
        .script-output {
            background: #1a1a2e;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            font-size: 0.8rem;
        }
        
        .script-container {
            position: relative;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍣 寿司打 自動プレイボット</h1>
        
        <div class="instructions">
            <h3>📖 使い方</h3>
            <ol>
                <li><a href="https://sushida.net/play.html" target="_blank" style="color: #feca57;">寿司打</a> を別タブで開く</li>
                <li>下の「スクリプトをコピー」ボタンをクリック</li>
                <li>寿司打のページでF12キーを押してデベロッパーツールを開く</li>
                <li>Consoleタブでスクリプトを貼り付けてEnter</li>
                <li>ゲームを開始し、表示されたローマ字をこのページで入力</li>
            </ol>
        </div>
        
        <div class="panels">
            <div class="panel">
                <h2>⌨️ 入力コントロール</h2>
                
                <div id="statusBadge" class="status status-stopped">停止中</div>
                
                <div class="input-group">
                    <label>ローマ字入力（画面に表示されたものを入力）</label>
                    <input type="text" id="romajiInput" placeholder="例: arigatougozaimasita">
                </div>
                
                <button class="btn-primary" onclick="sendToGame()">🚀 入力送信</button>
                <button class="btn-secondary" onclick="clearInput()">クリア</button>
                
                <br><br>
                
                <div class="input-group">
                    <label>辞書検索</label>
                    <input type="text" id="searchInput" placeholder="日本語またはローマ字で検索">
                </div>
                
                <button class="btn-secondary" onclick="searchDict()">🔍 検索</button>
                
                <div id="searchResults" style="margin-top: 15px; max-height: 150px; overflow-y: auto;"></div>
            </div>
            
            <div class="panel">
                <h2>📋 ログ</h2>
                <button class="btn-secondary" onclick="clearLog()">ログをクリア</button>
                <br><br>
                <div id="log"></div>
            </div>
        </div>
        
        <br>
        
        <div class="panel">
            <h2>📜 寿司打に貼り付けるスクリプト</h2>
            <p style="margin-bottom: 10px; color: #a0a0a0;">このスクリプトを寿司打のコンソールに貼り付けてください：</p>
            <button class="btn-primary" onclick="copyScript()">📋 スクリプトをコピー</button>
            <br><br>
            <div class="script-container">

            </div>
        </div>

        // スクリプト生成
        const injectionScript = `
// 寿司打ボット - キー入力受信スクリプト
(() => {
    console.log('🍣 寿司打ボット受信スクリプトをロード中...');
    
    // キー送信関数
    function sendKey(char) {
        const keyCode = char.toUpperCase().charCodeAt(0);
        const key = char.toLowerCase();
        
        const eventInit = {
            key: key,
            code: 'Key' + key.toUpperCase(),
            keyCode: keyCode,
            which: keyCode,
            bubbles: true,
            cancelable: true
        };
        
        // 特殊文字
        if (char === '-') { eventInit.key = '-'; eventInit.code = 'Minus'; eventInit.keyCode = 189; }
        else if (char === ',') { eventInit.key = ','; eventInit.code = 'Comma'; eventInit.keyCode = 188; }
        else if (char === '.') { eventInit.key = '.'; eventInit.code = 'Period'; eventInit.keyCode = 190; }
        else if (char === '?') { eventInit.key = '?'; eventInit.code = 'Slash'; eventInit.keyCode = 191; eventInit.shiftKey = true; }
        else if (char === '!') { eventInit.key = '!'; eventInit.code = 'Digit1'; eventInit.keyCode = 49; eventInit.shiftKey = true; }
        
        document.dispatchEvent(new KeyboardEvent('keydown', eventInit));
        document.dispatchEvent(new KeyboardEvent('keypress', { ...eventInit, charCode: eventInit.keyCode }));
        document.dispatchEvent(new KeyboardEvent('keyup', eventInit));
        
        const canvas = document.querySelector('canvas');
        if (canvas) {
            canvas.dispatchEvent(new KeyboardEvent('keydown', eventInit));
            canvas.dispatchEvent(new KeyboardEvent('keypress', { ...eventInit, charCode: eventInit.keyCode }));
            canvas.dispatchEvent(new KeyboardEvent('keyup', eventInit));
        }
    }
    
    // 入力関数
    window.sushidaType = async function(text) {
        console.log('⌨️ 入力: ' + text);
        for (let i = 0; i < text.length; i++) {
            sendKey(text[i]);
            await new Promise(r => setTimeout(r, 35 + Math.random() * 25));
        }
        console.log('✅ 完了');
    };
    
    console.log('✅ 準備完了！');
    console.log('使い方: sushidaType("ローマ字")');
})();
`;

        // スクリプト表示
        document.getElementById('scriptDisplay').textContent = injectionScript;

        // ログ追加
        function addLog(message, type = 'info') {
            const log = document.getElementById('log');
            const time = new Date().toLocaleTimeString('ja-JP');
            const div = document.createElement('div');
            div.className = `log-${type}`;
            div.textContent = `[${time}] ${message}`;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        // 送信
        function sendToGame() {
            const input = document.getElementById('romajiInput').value.trim();
            if (!input) {
                addLog('ローマ字を入力してください', 'warning');
                return;
            }
            
            addLog(`入力送信: ${input}`, 'success');
            
            // クリップボードにコピー（ユーザーがコンソールに貼り付け）
            const command = `sushidaType("${input}")`;
            navigator.clipboard.writeText(command).then(() => {
                addLog(`コマンドをコピーしました: ${command}`, 'info');
                addLog('寿司打のコンソールで Ctrl+V → Enter', 'info');
            });
            
            document.getElementById('romajiInput').value = '';
        }

        // 入力クリア
        function clearInput() {
            document.getElementById('romajiInput').value = '';
        }

        // ログクリア
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // 辞書検索
        function searchDict() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) return;
            
            const results = Object.entries(WORD_DICT).filter(([k, v]) => 
                k.includes(keyword) || v.includes(keyword)
            );
            
            const container = document.getElementById('searchResults');
            container.innerHTML = '';
            
            if (results.length === 0) {
                container.innerHTML = '<p style="color: #e74c3c;">見つかりませんでした</p>';
                return;
            }
            
            results.slice(0, 10).forEach(([word, romaji]) => {
                const div = document.createElement('div');
                div.style.cssText = 'padding: 8px; background: rgba(0,0,0,0.2); margin-bottom: 5px; border-radius: 5px; cursor: pointer;';
                div.innerHTML = `<strong>${word}</strong><br><span style="color: #feca57;">${romaji}</span>`;
                div.onclick = () => {
                    document.getElementById('romajiInput').value = romaji;
                    addLog(`選択: ${word} → ${romaji}`, 'info');
                };
                container.appendChild(div);
            });
        }

        // スクリプトコピー
        function copyScript() {
            navigator.clipboard.writeText(injectionScript).then(() => {
                addLog('スクリプトをコピーしました！寿司打のコンソールに貼り付けてください', 'success');
            });
        }

        // Enterキーで送信
        document.getElementById('romajiInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendToGame();
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchDict();
        });

        // 初期ログ
        addLog('寿司打ボットを起動しました', 'success');
        addLog('上の手順に従ってセットアップしてください', 'info');
    </script>
</body>
</html>
